name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable

      - name: Cargo fmt
        run: cargo fmt -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --all

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.90
        shell: bash
        run: |
          rustup toolchain install 1.90 --profile minimal --no-self-update
          rustup default 1.90

      - name: Cargo check
        run: cargo check --all-targets

  i18n:
    name: translations up to date
    runs-on: ubuntu-latest
    steps:
      # No `fetch-depth` needed: the check compares the blob hash of each
      # English source with the stamp its translation carries, which the
      # working tree alone gives. `git log` on the depth-1 clone Actions makes
      # would report one commit and pass forever while translations rot.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every translation against its English source
        run: ./scripts/i18n-check.sh

      - name: Check every link and anchor resolves
        run: ./scripts/i18n-links.py
