[package]
name = "roxanne"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight, extensible code editor built with Rust and iced"
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Roxanne"

[dependencies]
colony-ui = "0.1.6"
iced = { version = "0.14.0", features = ["advanced"] }
libloading = "0.8"
notify = "8.2.0"
regex = "1.11"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
streaming-iterator = "0.1"
toml = "1.1.8"
toml_edit = "0.25.17"
tree-sitter = "0.26"
tree-sitter-c = "0.24.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7.0"
walkdir = "2.5"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.12"

[[bench]]
name = "text_buffer"
harness = false

[[bench]]
name = "viewport"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
