[package]
name = "roxanne"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.12", features = ["advanced"] }

[patch.crates-io]
iced_widget = { path = "vendor/iced_widget" }
libloading = "0.8"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
streaming-iterator = "0.1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
toml = "0.8"
walkdir = "2.5"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.12"

[[bench]]
name = "text_buffer"
harness = false
